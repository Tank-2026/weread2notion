name: WeRead Backfill

# 补全历史记录里缺失的「类型 / 开始时间 / 结束时间 / 阅读时长」
# 只补空缺字段，绝不删除或重建任何页面，因此可以放心运行。
#
# 两种触发方式：
#   1. 手动：Actions → WeRead Backfill → Run workflow
#   2. 自动：每周六早上 8 点前完成（北京时间）—— 用于补上「在读的书」读完后的结束时间
on:
  workflow_dispatch:
  schedule:
    # UTC 周五 22:00 = 北京时间周六 06:00，提前 2 小时触发，
    # 给 GitHub 的调度延迟留缓冲，确保周六 8 点前完成
    - cron: '37 22 * * 5'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Backfill missing fields
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: weread2notion backfill
